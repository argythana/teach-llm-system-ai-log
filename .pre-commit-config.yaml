# Pre-commit hooks. Run with `prek` (a fast pre-commit drop-in, a dev dependency):
#   uv run prek install            # wire the pre-commit and commit-msg hooks (one-time)
#   uv run prek run --all-files    # apply to the whole repo
#
# `sessions/` and the judges' score files are records: they stay verbatim.
default_language_version:
  python: "python3"
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  - repo: "https://github.com/gitleaks/gitleaks"
    rev: "v8.30.1"
    hooks:
      - id: "gitleaks" # a token pasted into a session must never reach GitHub

  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: "v6.0.0"
    hooks:
      - id: "detect-private-key"
      - id: "check-added-large-files"
        args: ["--maxkb=1024"]
        exclude: "^uv\\.lock$" # the lockfile is text and grows with the stack
      - id: "check-json"
      - id: "check-toml"
      - id: "check-yaml"
      - id: "check-merge-conflict"
      - id: "end-of-file-fixer"
        exclude: "^sessions/"
      - id: "trailing-whitespace"
        exclude: "(\\.md$|^sessions/)" # preserve markdown hard breaks

  # Project tools, pinned via uv.lock and run through `uv run`.
  - repo: local
    hooks:
      - id: "mdformat"
        name: "mdformat (Markdown docs, wrap 88)"
        entry: uv run mdformat --wrap 88
        language: system
        files: "\\.md$"
        exclude: "^(\\.claude/|sessions/)" # exported transcripts stay verbatim
        require_serial: true
      - id: "ruff-check-py"
        name: "ruff format + check (tools/)"
        entry: bash -c 'uv run ruff format "$@" && uv run ruff check --fix "$@"' --
        language: system
        files: "^tools/.*\\.py$"
        require_serial: true
      # The names come from the gitignored private_terms.txt plus this machine's hostname
      # and username, so the check never publishes the names it looks for.
      - id: "private-terms"
        name: "no private names (private_terms.txt, hostname, username, session links)"
        entry: uv run python tools/check_private_terms.py
        language: system
        types: [text]
        require_serial: true
      - id: "private-terms-msg"
        name: "no private names in the commit message"
        entry: uv run python tools/check_private_terms.py --commit-msg
        language: system
        stages: [commit-msg]
